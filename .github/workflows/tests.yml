name: SentinelLog CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Tests and Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated pytest suite
        run: python -m pytest -v

      - name: Run Bandit SAST security scan
        run: |
          python -m bandit -r . \
            -x ./.venv,./.git,./.pytest_cache,./tests

      - name: Audit Python dependencies (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Verify Container Build
        run: docker build -t sentinellog:ci-test .
